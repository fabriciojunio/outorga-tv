# Ambiente local: Postgres e a API.
#
# Para desenvolver so o backend, subir apenas o banco ja basta:
#   docker compose up -d banco
# e rodar a aplicacao pela IDE ou por `mvn spring-boot:run`.

services:
  banco:
    image: postgres:16-alpine
    container_name: outorga-banco
    environment:
      POSTGRES_DB: outorga
      POSTGRES_USER: outorga
      POSTGRES_PASSWORD: outorga
    ports:
      - "5432:5432"
    volumes:
      - dados-do-banco:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U outorga -d outorga"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: outorga-api
    depends_on:
      banco:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://banco:5432/outorga
      DATABASE_USER: outorga
      DATABASE_PASSWORD: outorga
      OUTORGA_MODO: DEMONSTRACAO
      JWT_SEGREDO: segredo-de-desenvolvimento-com-mais-de-sessenta-e-quatro-caracteres-ok
      URL_PUBLICA: http://localhost:8080
      ORIGENS_PERMITIDAS: http://localhost:3000
    ports:
      - "8080:8080"

  # Servidor do modo "Em casa". Fica num perfil à parte porque não depende
  # da API nem do banco acima:
  #   PASTA_DE_VIDEOS=/caminho/dos/filmes docker compose --profile casa up -d
  # Os segredos (TMDB_TOKEN, CASA_SEGREDO, CASA_USUARIOS) vêm do web/.env.local.
  casa:
    profiles: [casa]
    build:
      context: ./web
    container_name: outorga-casa
    env_file: ./web/.env.local
    environment:
      CASA_BANCO: /dados/casa.db
      BIBLIOTECA_DIR: /videos
    ports:
      - "3000:3000"
    volumes:
      - acervo-da-casa:/dados
      - ${PASTA_DE_VIDEOS:-./videos}:/videos:ro
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

volumes:
  dados-do-banco:
  acervo-da-casa:
